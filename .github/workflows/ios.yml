name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  # PR validation, without the release upload.
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release:
        description: "Allega l'IPA alla release"
        type: boolean
        default: true

permissions:
  contents: write

# Only pull requests cancel their previous run; main pushes must finish.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ipa:
    name: Compila IPA (macOS)
    # macos-15 ships Xcode 16, whose SDK matches the Rust target we build.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 4. Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version

      - name: 5. Compila la static lib Rust
        run: ./scripts/build-ios-rust.sh

      - name: 6. Genera il progetto Xcode (XcodeGen)
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          ls -la

      - name: 7. Compila .app senza firma
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project Bussola.xcodeproj \
            -scheme Bussola \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 8. Impacchetta IPA + bundle e verifica il link a Rust
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Bussola.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Bussola.app non trovato"
            find "$RUNNER_TEMP/dd" -maxdepth 6 -name '*.app' || true
            exit 1
          fi

          # --- 1. Nessuna dipendenza dinamica verso la libreria Rust ---------
          # Il bug che ha fatto crashare l'app all'avvio: `ld` preferiva
          # libbussola.dylib e registrava il path assoluto del runner come
          # install name. Un'app iOS non deve dipendere da percorsi del runner.
          #
          # `otool -L` stampa come PRIMA riga il path dell'eseguibile stesso
          # ("<file>:"), non una dipendenza: va scartata, altrimenti ogni build
          # risulterebbe "dipendente da /Users/runner".
          #
          # Il filtro e' in Python e non in grep: BSD grep (macOS) non supporta
          # `\s` in -E e lo tratterebbe come la lettera "s".
          otool -L "$APP/Bussola"
          otool -L "$APP/Bussola" | python3 -c '
          import sys
          # Le dipendenze sono le righe indentate; l"intestazione ("<file>:") e
          # qualsiasi riga non indentata vanno ignorate anche se ripetute.
          deps = [l.strip() for l in sys.stdin.read().splitlines()
                  if l[:1] in (" ", "\t") and l.strip()]
          ok = ("/usr/lib/", "/System/Library/", "@rpath/", "@executable_path/", "@loader_path/")
          bad = [d for d in deps if not d.startswith(ok)]
          rust = [d for d in deps if "bussola" in d.lower()]
          print(f"Dipendenze dinamiche: {len(deps)}")
          for d in bad:
              print(f"  inattesa: {d}")
          for d in rust:
              print(f"  libreria Rust dinamica: {d}")
          if bad or rust:
              print("::error::l'"'"'eseguibile ha dipendenze dinamiche inattese o linka libbussola.dylib")
              sys.exit(1)
          print("Dipendenze dinamiche pulite (solo framework di sistema).")
          '

          # --- 2. Il core Rust e' davvero dentro l'eseguibile ---------------
          # Informativo, non bloccante: se la static lib non fosse linkata il
          # link fallirebbe prima (simboli bussola_* non risolti), e se fosse
          # una dylib lo direbbe gia' otool -L qui sopra. Questi conteggi
          # servono solo come traccia nel log.
          SYMS=$( { nm -gU "$APP/Bussola" 2>/dev/null || true; } | grep -E "_bussola_" | grep -c " T " || true )
          echo "Simboli bussola_* definiti (informativo): $SYMS"

          # I dati statici di una .a finiscono nell'eseguibile. Ricerca diretta
          # sui byte, perche' `strings` di macOS scarta di default le sequenze
          # piu' corte di 4 caratteri e "NNE"/"ENE"/... ne hanno 3.
          python3 - "$APP/Bussola" <<'PY'
          import sys
          data = open(sys.argv[1], 'rb').read()
          markers = [b'NNE', b'ENE', b'SSE', b'SSW', b'WNW', b'NNW']
          found = [m.decode() for m in markers if m + b'\0' in data]
          print("Etichette della rosa trovate nel binario (informativo): "
                + ", ".join(found) + f" ({len(found)}/{len(markers)})")
          PY
          echo "Core Rust linkato staticamente (nessuna dipendenza dinamica)."

          mkdir -p dist/ipa/Payload
          cp -R "$APP" dist/ipa/Payload/
          ( cd dist/ipa && zip -qry ../Bussola.ipa Payload )
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Bussola.app.zip
          cd dist
          shasum -a 256 Bussola.ipa | awk '{print $1"  Bussola.ipa"}' > Bussola.ipa.sha256
          rm -rf ipa
          ls -lh Bussola.ipa Bussola.app.zip
          SIZE=$(du -h Bussola.ipa | cut -f1)
          {
            echo "### IPA iOS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`Bussola.ipa\` (non firmato) |"
            echo "| Bundle | \`Bussola.app.zip\` |"
            echo "| Peso | **$SIZE** |"
            echo "| Bundle ID | \`com.bussola.app\` |"
            echo ""
            echo "L'IPA non e' firmato: installalo con Sideloadly/AltStore usando il tuo Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 9. Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bussola-ipa
          path: |
            dist/Bussola.ipa
            dist/Bussola.app.zip
            dist/Bussola.ipa.sha256
          retention-days: 90
          if-no-files-found: error

      - name: 10. Allega alla release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "::error::versionName non trovato"; exit 1; }
          TAG="v$VERSION"
          echo "Release tag: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bussola $TAG" \
              --notes "Bussola $TAG: bussola Android/iOS con core Rust (no_std)." \
              || sleep 5
          fi
          gh release upload "$TAG" dist/Bussola.ipa dist/Bussola.app.zip dist/Bussola.ipa.sha256 --clobber
