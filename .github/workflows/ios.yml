name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  # PR validation, without the release upload.
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release:
        description: "Allega l'IPA alla release"
        type: boolean
        default: true

permissions:
  contents: write

# Only pull requests cancel their previous run; main pushes must finish.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ipa:
    name: Compila IPA (macOS)
    # macos-15 ships Xcode 16, whose SDK matches the Rust target we build.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 4. Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version

      - name: 5. Compila la static lib Rust
        run: ./scripts/build-ios-rust.sh

      - name: 6. Genera il progetto Xcode (XcodeGen)
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          ls -la

      - name: 7. Compila .app senza firma
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project Bussola.xcodeproj \
            -scheme Bussola \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 8. Impacchetta IPA + bundle e verifica il link a Rust
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Bussola.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Bussola.app non trovato"
            find "$RUNNER_TEMP/dd" -maxdepth 6 -name '*.app' || true
            exit 1
          fi

          # --- 1. Nessuna dipendenza dinamica verso la libreria Rust ---------
          # Il bug che ha fatto crashare l'app all'avvio: `ld` preferiva
          # libbussola.dylib e registrava il path assoluto del runner come
          # install name. Un'app iOS non deve dipendere da percorsi del runner.
          LINKAGE=$(otool -L "$APP/Bussola")
          echo "$LINKAGE"
          if echo "$LINKAGE" | grep -E "bussola|/Users/runner|/private/|/var/folders"; then
            echo "::error::l'eseguibile dipende da un percorso assoluto o da libbussola.dylib"
            exit 1
          fi
          if ! echo "$LINKAGE" | grep -q "/usr/lib/libSystem.B.dylib"; then
            echo "::error::libSystem non linkata: dipendenze inattese"
            exit 1
          fi
          echo "Dipendenze dinamiche pulite (solo framework di sistema)."

          # --- 2. Il core Rust e' davvero dentro l'eseguibile ---------------
          # Codice e dati di una static lib finiscono nell'eseguibile, quindi i
          # letterali della rosa devono essere presenti. Se mancano, la lib non
          # e' stata linkata (era il secondo sintomo del bug).
          MISSING=""
          for label in NNE ENE SSE SSW WNW NNW; do
            if ! strings -a "$APP/Bussola" | grep -qx "$label"; then
              MISSING="$MISSING $label"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::etichette della rosa assenti dal binario:$MISSING -- la static lib Rust non e' linkata"
            exit 1
          fi
          COUNT=$( { nm -a "$APP/Bussola" 2>/dev/null || true; } | grep -c "bussola_" || true )
          echo "Etichette della rosa presenti; simboli bussola_*: $COUNT"
          echo "Core Rust linkato staticamente."

          mkdir -p dist/ipa/Payload
          cp -R "$APP" dist/ipa/Payload/
          ( cd dist/ipa && zip -qry ../Bussola.ipa Payload )
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Bussola.app.zip
          cd dist
          shasum -a 256 Bussola.ipa | awk '{print $1"  Bussola.ipa"}' > Bussola.ipa.sha256
          rm -rf ipa
          ls -lh Bussola.ipa Bussola.app.zip
          SIZE=$(du -h Bussola.ipa | cut -f1)
          {
            echo "### IPA iOS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`Bussola.ipa\` (non firmato) |"
            echo "| Bundle | \`Bussola.app.zip\` |"
            echo "| Peso | **$SIZE** |"
            echo "| Bundle ID | \`com.bussola.app\` |"
            echo ""
            echo "L'IPA non e' firmato: installalo con Sideloadly/AltStore usando il tuo Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 9. Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bussola-ipa
          path: |
            dist/Bussola.ipa
            dist/Bussola.app.zip
            dist/Bussola.ipa.sha256
          retention-days: 90
          if-no-files-found: error

      - name: 10. Allega alla release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || { echo "::error::versionName non trovato"; exit 1; }
          TAG="v$VERSION"
          echo "Release tag: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bussola $TAG" \
              --notes "Bussola $TAG: bussola Android/iOS con core Rust (no_std)." \
              || sleep 5
          fi
          gh release upload "$TAG" dist/Bussola.ipa dist/Bussola.app.zip dist/Bussola.ipa.sha256 --clobber
