name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  # PR validation, without the release upload.
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      release:
        description: "Allega l'IPA alla release"
        type: boolean
        default: true

permissions:
  contents: write

# Only pull requests cancel their previous run; main pushes must finish.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ipa:
    name: Compila IPA (macOS)
    # macos-15 ships Xcode 16, whose SDK matches the Rust target we build.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Install Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 4. Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version

      - name: 5. Compila la static lib Rust
        run: ./scripts/build-ios-rust.sh

      - name: 6. Genera il progetto Xcode (XcodeGen)
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios
          xcodegen generate --spec project.yml
          ls -la

      - name: 7. Compila .app senza firma
        run: |
          set -euo pipefail
          cd ios
          xcodebuild \
            -project Bussola.xcodeproj \
            -scheme Bussola \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 8. Impacchetta IPA + bundle e verifica il link a Rust
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Bussola.app"
          [ -d "$APP" ] || { echo "::error::Bussola.app non trovato"; find "$RUNNER_TEMP/dd" -name '*.app' -maxdepth 6; exit 1; }

          # La libreria Rust deve essere davvero linkata nell'eseguibile.
          # Il binario installato e' strippato, quindi i simboli si cercano nel
          # dSYM generato da Xcode (stessa immagine, simboli conservati).
          DWARF="$APP.dSYM/Contents/Resources/DWARF/Bussola"
          SYMBOLS="$APP/Bussola"
          [ -f "$DWARF" ] && SYMBOLS="$DWARF"
          COUNT=$(nm -a "$SYMBOLS" 2>/dev/null | grep -c "bussola_")
          echo "Simboli bussola_* trovati: $COUNT"
          # 10 funzioni C: new/free/update/update_rad/heading/set_offset/reset +
          # cardinal/cardinal_count/version. Dead-stripping keeps the reachable
          # ones, so require a solid subset rather than all ten.
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::solo $COUNT simboli bussola_*: il core Rust non risulta linkato"
            nm -a "$SYMBOLS" 2>/dev/null | head -20 || ls -la "$APP"
            exit 1
          fi
          echo "Core Rust linkato correttamente."

          mkdir -p dist/ipa/Payload
          cp -R "$APP" dist/ipa/Payload/
          ( cd dist/ipa && zip -qry ../Bussola.ipa Payload )
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Bussola.app.zip
          cd dist
          shasum -a 256 Bussola.ipa | awk '{print $1"  Bussola.ipa"}' > Bussola.ipa.sha256
          rm -rf ipa
          ls -lh Bussola.ipa Bussola.app.zip
          SIZE=$(du -h Bussola.ipa | cut -f1)
          {
            echo "### IPA iOS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`Bussola.ipa\` (non firmato) |"
            echo "| Bundle | \`Bussola.app.zip\` |"
            echo "| Peso | **$SIZE** |"
            echo "| Bundle ID | \`com.bussola.app\` |"
            echo ""
            echo "L'IPA non e' firmato: installalo con Sideloadly/AltStore usando il tuo Apple ID."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 9. Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bussola-ipa
          path: |
            dist/Bussola.ipa
            dist/Bussola.app.zip
            dist/Bussola.ipa.sha256
          retention-days: 90
          if-no-files-found: error

      - name: 10. Allega alla release
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bussola v1.0.0" \
              --notes "Bussola — bussola iOS/Android con core Rust. Il primo job che arriva crea la release, gli altri allegano i propri file."
          fi
          gh release upload "$TAG" dist/Bussola.ipa dist/Bussola.app.zip dist/Bussola.ipa.sha256 --clobber
